# On every push to main or staging: runs lint, builds the Jelly image and
# pushes it to GHCR, then updates that branch's deploy branch with the image
# tag pinned in docker-compose.yml. The Portainer stack polls its deploy branch
# and redeploys on a new commit, so nothing deploys unless lint passes.
# Pull requests to main run lint and build the image without pushing it.
name: Build and release

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

# One release at a time per branch, so an older run can't overwrite its deploy
# branch after a newer one.
concurrency:
  group: build-and-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/jelly
  # main releases to `deploy`, staging to `deploy-staging`.
  DEPLOY_BRANCH: ${{ github.ref_name == 'main' && 'deploy' || 'deploy-staging' }}
  # Moving tag for local use; the deploy branches always pin the exact tag.
  CHANNEL_TAG: ${{ github.ref_name == 'main' && 'latest' || 'staging' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      # Installs the pnpm version from package.json's packageManager field.
      # pnpm 12 needs v6.1.0+, and the moving v6 tag still points at v6.0.10.
      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  images:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ env.CHANNEL_TAG }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: images
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Pin image tag
        run: sed -i "s#/jelly:latest#/jelly:${GITHUB_SHA}#" docker-compose.yml

      - name: Push the deploy branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$DEPLOY_BRANCH"
          git commit -am "deploy: ${GITHUB_SHA}"
          git push --force origin "$DEPLOY_BRANCH"
